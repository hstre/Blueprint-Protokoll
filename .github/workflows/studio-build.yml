name: Blueprint Studio — Build Installers

on:
  push:
    branches: ['**']
    tags: ['studio-v*']
    paths: ['blueprint-studio/**', '.github/workflows/studio-build.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: blueprint-studio

jobs:
  test:
    name: Tests & Typecheck (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blueprint-studio/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  build:
    name: Installer (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: blueprint-studio-macos
            path: |
              blueprint-studio/dist/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: blueprint-studio-windows
            path: |
              blueprint-studio/dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blueprint-studio/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run ${{ matrix.script }}
        env:
          # unsigned builds: skip mac code signing entirely
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Release (bei Tag)
    if: startsWith(github.ref, 'refs/tags/studio-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
